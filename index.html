<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14111c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Esquire — A Legal Career</title>
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/press-start-2p-latin.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Silkscreen';src:url(fonts/silkscreen-latin.woff2) format('woff2');font-display:swap}
:root{--bg:#14111c;--panel:#1f1a2b;--edge:#3a3050;--ink:#efe6d2;--muted:#9a8fb0;--gold:#ffd166;--good:#7bd389;--lp:#c3a6ff;--accent:#e76f51;--read:system-ui,-apple-system,Roboto,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:13px;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:10px 12px 40px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--gold);letter-spacing:1px}
.cur{font-family:'Press Start 2P',monospace;font-size:10px;display:flex;gap:10px}
.cur .s{color:var(--gold)}.cur .l{color:var(--lp)}
.stagewrap{position:relative;border:3px solid #000;box-shadow:0 0 0 3px var(--edge),0 8px 20px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;background:#000}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.badge{position:absolute;top:6px;left:6px;font-family:'Press Start 2P',monospace;font-size:9px;background:rgba(0,0,0,.65);color:#fff;padding:4px 6px;border-radius:2px;pointer-events:none}
.pv{position:absolute;bottom:6px;left:0;right:0;display:none;justify-content:space-between;padding:0 6px}
.pv.show{display:flex}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:4px;padding:10px}
.job-t{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.45}
.job-s{color:var(--muted);margin-top:6px;font-family:var(--read);font-size:14px;line-height:1.4}
.ladder{display:flex;gap:2px;margin-top:8px}
.pip{flex:1;height:6px;background:#2d2640;border-radius:1px}
.pip.sch{background:#3a3050}.pip.done{background:var(--good)}.pip.cur{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;background:#0e0b14;border:2px solid #000;margin-top:6px}
.bar>div{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#e0b040 6px 8px)}
.bar.promo>div{background:repeating-linear-gradient(90deg,var(--good) 0 6px,#5fb56d 6px 8px)}
.small{font-family:var(--read);font-size:14px;line-height:1.45;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{flex:1;font-family:'Press Start 2P',monospace;font-size:10px;min-height:48px;padding:6px 2px;background:#2d2640;border:2px solid #000;color:var(--muted);border-radius:2px;cursor:pointer;position:relative}
.tab.on{background:var(--gold);color:#2a1d06}
.tab .dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;background:var(--accent);border:2px solid #000;border-radius:50%}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--edge)}
.item:last-child{border:none}
.item .ic{font-size:20px;width:26px;text-align:center;flex:none}
.item .b{flex:1;min-width:0}
.item .n{font-size:14px}.item .d{font-family:var(--read);font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
.btn{font-family:'Press Start 2P',monospace;border:2px solid #000;background:var(--gold);color:#2a1d06;padding:8px 10px;font-size:10px;min-height:40px;border-radius:2px;box-shadow:0 3px 0 #7a5a10;cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #7a5a10}
.btn:disabled{background:#4a4258;color:#8a8098;box-shadow:0 3px 0 #2a2436;cursor:default}
.btn.ghost{background:#2d2640;color:var(--ink);box-shadow:0 3px 0 #0e0b14}
.btn.lp{background:var(--lp);box-shadow:0 3px 0 #5a3f99}
.btn.big{width:100%;padding:14px;font-size:11px;margin-top:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-family:'Press Start 2P',monospace;font-size:10px;min-height:36px;padding:6px 9px;border:2px solid #000;background:#2d2640;color:var(--muted);border-radius:2px;cursor:pointer}
.chip.on{background:var(--lp);color:#1a1030}
.locker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.egg{background:#2d2640;border:2px solid #000;border-radius:3px;padding:8px 4px;text-align:center;font-size:10px;line-height:1.3;cursor:pointer;position:relative;min-height:78px;font-size:11px}
.egg .e{font-size:22px;display:block;margin-bottom:4px}
.egg.off{color:#6a6080}.egg.off .e{filter:grayscale(1) brightness(.3)}
.egg .nw{position:absolute;top:2px;right:2px;font-family:'Press Start 2P',monospace;font-size:8px;background:var(--accent);color:#fff;padding:2px}
.sec{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(8,6,12,.85);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}
.card{background:var(--panel);border:3px solid var(--gold);border-radius:4px;padding:16px;max-width:380px;width:100%;max-height:88vh;overflow:auto}
.card h3{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);margin-bottom:10px;line-height:1.5}
.card p{font-family:var(--read);font-size:15px;line-height:1.5;margin-bottom:8px}
.pick{display:block;width:100%;text-align:left;background:#2d2640;border:2px solid var(--edge);border-radius:3px;color:var(--ink);padding:12px;margin-top:8px;font-family:var(--read);font-size:14px;line-height:1.4;cursor:pointer}
.pick b{font-family:'Press Start 2P',monospace;font-size:10px;display:block;margin-bottom:4px}
.pick.off{opacity:.45;cursor:default}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.sw{display:inline-block;width:36px;height:36px;border:2px solid #000;border-radius:3px;margin:2px;cursor:pointer}
.sw.on{outline:3px solid var(--gold)}
input.name{font-family:inherit;font-size:13px;background:#0e0b14;border:2px solid var(--edge);color:var(--ink);padding:8px;width:100%;border-radius:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:2px solid var(--gold);color:var(--gold);font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 12px;border-radius:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%;text-align:center;line-height:1.5}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">ESQUIRE</div><div class="cur"><span class="s" id="stars">★0</span><span class="l" id="lpv">✦0</span><span id="sdv" style="color:#8ecae6"></span></div></header>
  <div class="stagewrap"><canvas id="scene" width="160" height="112"></canvas><div class="badge" id="badge"></div>
    <div class="pv" id="pv"><button class="btn ghost" onclick="pvStep(-1)">◀</button><button class="btn ghost" onclick="pvStop()">EXIT PREVIEW</button><button class="btn ghost" onclick="pvStep(1)">▶</button></div>
    <div class="flash" id="flash"></div></div>
  <div class="panel small" id="overheard" style="line-height:1.5;min-height:38px">💬 …</div>
  <div class="panel"><div class="job-t" id="jobT"></div><div class="job-s" id="jobS"></div><div class="ladder" id="ladder"></div></div>
  <div class="panel">
    <div class="row"><span id="loopName"></span><span class="small" id="loopLeft"></span></div>
    <div class="bar"><div id="loopFill"></div></div>
    <div class="row" style="margin-top:8px"><span id="promoTxt"></span><span class="small" id="eta"></span></div>
    <div class="bar promo"><div id="promoFill"></div></div>
    <div class="small" style="margin-top:6px" id="rateTxt"></div>
    <div class="small" style="margin-top:4px;color:#c8bfd8" id="caseTxt"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="tabBody"></div>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ESQUIRE — watch a lawyer climb from 1L to the top of their field.
   Run = one career. Loops finish on their own, promotions are automatic,
   Retire (prestige) -> ✦ Legacy -> skill tree. Tuned for ~12h runs and
   ~3–4 weeks per track (see scratch sim2.js).
   ===================================================================== */
const SIM=typeof window==='undefined'||!!window.__SIM;
const SAVE='esquire_career_v1';

/* ============================ ECONOMY CORE ============================ */
const SCHOOL_N=9, TRACK_N=10, CAPJ=SCHOOL_N+TRACK_N-1;   // J: 0..8 school, 9..18 track jobs
const TIDS=['lit','big','corp','gov'];
const TIER_MULT=6;                                        // each summit makes untouched tracks' branches pricier (×1+6n²)
const E={LOOP_BASE:30,LOOP_GROW:1.8,NEED_BASE:5,LP_GROW:1.35,OFFLINE_BASE:12*3600};
const PERKS=[
  {id:'caf', name:'Espresso Machine',icon:'☕',desc:'+25% work speed',base:3, grow:2.2},
  {id:'asst',name:'Assistant',       icon:'🧑‍💼',desc:'+50% work speed',base:30,grow:2.6},
  {id:'rolo',name:'Rolodex',         icon:'📇',desc:'+25% ★ per loop', base:10,grow:2.2},
];
const TREE={};
function TN(id,o){TREE[id]=Object.assign({id,max:1,grow:2,req:[]},o);}
TN('speed',  {br:'core',name:'Well-Rested',    icon:'😴',base:10,grow:2,  max:8, desc:'×1.15 work speed everywhere',fx:l=>'×'+Math.pow(1.15,l).toFixed(2)+' speed'});
TN('star',   {br:'core',name:'Rainmaker',      icon:'🌧️',base:5, grow:1.9,max:10,desc:'×1.3 ★ per loop',fx:l=>'×'+Math.pow(1.3,l).toFixed(2)+' ★'});
TN('study',  {br:'core',name:'Study Habits',   icon:'📖',base:8, grow:1.8,max:8, req:['speed'],desc:'×1.5 speed in law school',fx:l=>'×'+Math.pow(1.5,l).toFixed(1)+' in school'});
TN('legacy', {br:'core',name:'Legacy',         icon:'🏛️',base:15,grow:2.2,max:8, req:['star'],desc:'×1.15 ✦ from retiring',fx:l=>'×'+Math.pow(1.15,l).toFixed(2)+' ✦'});
TN('head',   {br:'core',name:'Head Start',     icon:'🎒',base:40,grow:2.2,max:6, req:['study'],desc:'Each new career starts one law-school stage later',fx:l=>'Start at '+SCHOOL[Math.min(l,SCHOOL_N-1)].t});
TN('owl',    {br:'core',name:'Night Owl',      icon:'🦉',base:30,grow:2.5,max:3, req:['speed'],desc:'+4h offline cap (base 12h)',fx:l=>(12+4*l)+'h offline cap'});
TN('eggs',   {br:'core',name:'Curiosity',      icon:'🔍',base:20,grow:2,  max:5, req:['star'],desc:'Rare easter eggs turn up 50% more often',fx:l=>'×'+(1+.5*l)+' egg luck'});
TN('decor',  {br:'core',name:'Interior Design',icon:'🪴',base:60,grow:1,  max:1, req:['eggs'],desc:'Unlocks the office aquarium easter egg'});
const TRK_TXT={lit:['Courtroom Presence','Clerkship','Jury Whisperer'],big:['Billable Machine','Summer Program','Client Magnet'],corp:['Business Acumen','MBA','Stock Options'],gov:['Public Servant','Campaign Trail','Press Savvy']};
TIDS.forEach(t=>{
  const n=TRK_TXT[t];
  TN(t+'_focus',{br:t,name:n[0],icon:'⚡',base:10,grow:1.45,max:25,req:t==='gov'?['gov_open']:[],desc:'×1.25 speed on this track',fx:l=>'×'+Math.pow(1.25,l).toFixed(1)+' speed'});
  TN(t+'_skip', {br:t,name:n[1],icon:'⏭️',base:300,grow:3,max:3,req:[t+'_focus'],desc:'Start this track one job higher per level',fx:l=>'Start as '+TRACKS[t].jobs[l].t});
  TN(t+'_star', {br:t,name:n[2],icon:'⭐',base:25,grow:1.9,max:8,req:[t+'_focus'],desc:'×1.5 ★ on this track',fx:l=>'×'+Math.pow(1.5,l).toFixed(1)+' ★'});
});
TN('warp',      {br:'space',cur:'sd',name:'Warp Drive',          icon:'🚀',base:10,grow:1.6,max:25,desc:'×1.2 speed in space',fx:l=>'×'+Math.pow(1.2,l).toFixed(1)+' speed'});
TN('translator',{br:'space',cur:'sd',name:'Universal Translator',icon:'🗣️',base:8, grow:1.9, max:10,desc:'×1.4 ★ in space',fx:l=>'×'+Math.pow(1.4,l).toFixed(1)+' ★'});
TN('xenolaw',   {br:'space',cur:'sd',name:'Xenolaw',             icon:'👽',base:15,grow:1.7, max:15,req:['warp'],desc:'×1.2 speed once you land (Moon onward)',fx:l=>'×'+Math.pow(1.2,l).toFixed(1)+' on planets'});
TN('stardust',  {br:'space',cur:'sd',name:'Cosmic Precedent',    icon:'🌠',base:20,grow:2.2, max:8, req:['translator'],desc:'×1.2 ✧ from relaunching',fx:l=>'×'+Math.pow(1.2,l).toFixed(2)+' ✧'});
TN('launch',    {br:'space',cur:'sd',name:'Launch Clearance',    icon:'🛰️',base:200,grow:3, max:3, req:['warp'],desc:'Each relaunch starts one posting further out',fx:l=>'Start as '+SPACE[l].t});
TN('cryo',      {br:'space',cur:'sd',name:'Cryosleep',           icon:'🧊',base:40,grow:3,   max:2, req:['warp'],desc:'+6h offline cap',fx:l=>'+'+6*l+'h offline'});
TN('gov_open',{br:'gov',name:'Political Connections',icon:'🤝',base:400,grow:1,max:1,desc:'Unlocks the Government track'});

let S;
function freshRun(){return {track:null,J:0,prog:0,loops:0,stars:0,perks:{},runT:0,maxJ:0,fork:false};}
function fresh(){return Object.assign({v:1,name:rndName(),mode:'earth',ascended:false,sd:0,sdTotal:0,sruns:0,spaceWon:false,bestSpace:0,lastCase:'',lp:0,lpTotal:0,tree:{},runs:0,summits:{},best:{},eggs:{},eggNew:{},pref:null,autoOn:true,dev:1,
  stats:{loops:0,promos:0,taps:0,nights:0,lastNight:0,firstSeen:Date.now()},look:{skin:1,hair:0},lastSeen:Date.now(),tab:'career',treeBr:'core'},freshRun());}
function rndName(){const F=['Riley','Morgan','Avery','Quinn','Reese','Sloane','Dakota','Blair','Emerson','Harper'],L=['Vance','Calloway','Sterling','Okonkwo','Marchetti','Delacroix','Whitfield','Nakamura'];return F[Math.random()*F.length|0]+' '+L[Math.random()*L.length|0];}
const lv=id=>S.perks[id]||0, tl=id=>S.tree[id]||0;
const onTrack=()=>S.mode!=='space'&&S.J>=SCHOOL_N;
function loopSecs(J){return E.LOOP_BASE*Math.pow(E.LOOP_GROW,J+(S.mode==='space'?SPACE_OFF:0));}
function loopsNeed(J){return E.NEED_BASE+J+(S.mode==='space'?SPACE_OFF:0);}
function summitN(){return TIDS.filter(t=>S.summits[t]).length;}
function speed(){
  if(S.mode==='space')return (1+.25*lv('caf'))*(1+.5*lv('asst'))*Math.pow(1.2,tl('warp'))*(S.J>=3?Math.pow(1.2,tl('xenolaw')):1)*1.5*S.dev;
  let m=(1+.25*lv('caf'))*(1+.5*lv('asst'))*Math.pow(1.15,tl('speed'))*Math.pow(1.25,summitN())*S.dev;
  if(onTrack())m*=Math.pow(1.25,tl(S.track+'_focus'));else m*=Math.pow(1.5,tl('study'));
  return m;
}
function starGain(){if(S.mode==='space')return Math.round((1+S.J+SPACE_OFF)*(1+.25*lv('rolo'))*Math.pow(1.4,tl('translator')));let g=(1+S.J)*(1+.25*lv('rolo'))*Math.pow(1.3,tl('star'));if(onTrack())g*=Math.pow(1.5,tl(S.track+'_star'));return Math.round(g);}
function perkCost(p){return Math.round(p.base*Math.pow(p.grow,lv(p.id)));}
function tierMult(id){const b=TREE[id].br;return id!=='gov_open'&&TIDS.includes(b)&&!S.summits[b]?1+TIER_MULT*summitN()*summitN():1;}
function treeCost(id){const n=TREE[id];return Math.round(n.base*Math.pow(n.grow,tl(id))*tierMult(id));}
function treeReqMet(id){return TREE[id].req.every(r=>tl(r)>0);}
function offlineCap(){return E.OFFLINE_BASE+4*3600*tl('owl')+6*3600*tl('cryo');}
function lpFor(maxJ){return maxJ<3?0:Math.floor(Math.pow(E.LP_GROW,maxJ)*Math.pow(1.15,tl('legacy'))*(1+.25*summitN()));}
function canRetire(){return S.mode==='space'?S.maxJ>=2:S.maxJ>=3;}
function trackUnlocked(t){return t!=='gov'||tl('gov_open')>0;}

function advance(sec,ev){
  ev=ev||{loops:0,stars:0,promos:[],eggs:[]};
  let guard=0;
  while(sec>0&&!S.fork&&guard++<200000){
    const r=speed(),left=(loopSecs(S.J)-S.prog)/r;
    if(sec>=left){sec-=left;S.runT+=left;completeLoop(ev);}
    else{S.prog+=sec*r;S.runT+=sec;sec=0;}
  }
  if(S.fork)S.runT+=sec;
  return ev;
}
function completeLoop(ev){
  const g=starGain();S.prog=0;S.loops++;S.stats.loops++;S.stars+=g;ev.loops++;ev.stars+=g;
  fx.pop=1;
  if(S.autoOn)autoBuy();
  rollEggs(ev);
  S.lastCase=caseName();
  if(S.J<capJ()&&S.loops>=loopsNeed(S.J)){
    if(S.mode!=='space'&&S.J===SCHOOL_N-1){
      if(S.pref&&trackUnlocked(S.pref)){chooseTrack(S.pref);ev.promos.push(jobOf().t);}
      else{S.fork=true;ev.promos.push('Passed the bar!');}
      return;
    }
    S.J++;S.loops=0;S.maxJ=Math.max(S.maxJ,S.J);S.stats.promos++;
    if(onTrack())S.best[S.track]=Math.max(S.best[S.track]||0,S.J-SCHOOL_N);
    if(S.mode==='space'){S.bestSpace=Math.max(S.bestSpace||0,S.J);if(S.J===capJ()&&!S.spaceWon){S.spaceWon=true;ev.promos.push('CLO OF SPACE');}else ev.promos.push(jobOf().t);}
    else if(S.J===CAPJ&&!S.summits[S.track]){S.summits[S.track]=true;ev.promos.push('SUMMIT — '+jobOf().t);}
    else ev.promos.push(jobOf().t);
    fx.promo=2;
    rollEggs(ev);
  }
}
function autoBuy(){for(let k=0;k<60;k++){let best=null;for(const p of PERKS){const c=perkCost(p);if(c<=S.stars&&(!best||c<perkCost(best)))best=p;}if(!best)break;S.stars-=perkCost(best);S.perks[best.id]=lv(best.id)+1;}}
function chooseTrack(t){
  S.track=t;S.pref=t;S.fork=false;S.J=SCHOOL_N+tl(t+'_skip');S.loops=0;S.prog=0;S.maxJ=Math.max(S.maxJ,S.J);
  S.best[t]=Math.max(S.best[t]||0,S.J-SCHOOL_N);
}
function retire(){
  if(!canRetire())return 0;
  if(S.mode==='space'){const g=sdFor(S.maxJ);S.sd+=g;S.sdTotal+=g;S.sruns++;Object.assign(S,freshRun());S.J=Math.min(tl('launch'),3);S.maxJ=S.J;rollEggs({eggs:[]});return g;}
  const g=lpFor(S.maxJ);S.lp+=g;S.lpTotal+=g;S.runs++;
  Object.assign(S,freshRun());S.J=Math.min(tl('head'),SCHOOL_N-1);S.maxJ=S.J;
  rollEggs({eggs:[]});
  return g;
}
function buyTree(id){const n=TREE[id],cur=n.cur||'lp';if(tl(id)>=n.max||!treeReqMet(id))return false;const c=treeCost(id);if(S[cur]<c)return false;S[cur]-=c;S.tree[id]=tl(id)+1;rollEggs({eggs:[]});return true;}

/* ============================ CAREER DATA ============================ */
const SCHOOL=[
  {t:'Orientation',w:'Campus Quad',s:'Welcome, 1L. Buy the casebooks.',sc:'quad'},
  {t:'1L Fall',w:'Lecture Hall',s:'Contracts, Torts, Civ Pro. Cold calls.',sc:'lecture'},
  {t:'1L Finals',w:'Library · 2am',s:'Outlines, flashcards, fear.',sc:'library',p:{night:1}},
  {t:'Summer Associate',w:'Firm Summer Program',s:'Free lunches. Mild panic.',sc:'office',p:{lvl:0,fl:12,summer:1}},
  {t:'2L · Law Review',w:'Law Review Office',s:'Bluebooking until dawn.',sc:'library',p:{review:1}},
  {t:'OCI Interviews',w:'Hotel Suite 1204',s:'Twenty interviews. One suit.',sc:'interview'},
  {t:'3L · Moot Court',w:'Moot Courtroom',s:'May it please the court…',sc:'court',p:{moot:1,nJ:3}},
  {t:'Graduation',w:'Commencement',s:'Juris Doctor. Finally.',sc:'quad',p:{grad:1}},
  {t:'Bar Exam',w:'Convention Center',s:'Two days. Twelve hours. One shot.',sc:'exam'},

function rollEggs(ev){

    let got=e.cond?e.cond():(e.where()&&Math.random()<e.chance*(1+.5*tl('eggs')));

  }
}

const W=160,H=112;
let g=null;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function skyState(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h<6||h>=20.5)return{top:'#0b1633',bot:'#27356e',night:true};
  if(h<7.5||h>=18.5)return{top:'#e07a5f',bot:'#ffd29a',night:false};
  return{top:'#5db4ee',bot:'#c2e6ff',night:false};}
function sky(x,y,w,h){const s=skyState();R(x,y,w,h,s.bot);R(x,y,w,Math.ceil(h*.55),s.top);if(s.night){const r=rng(7);for(let i=0;i<w*h/50;i++)R(x+r()*w,y+r()*h*.6,1,1,'#fff');}return s;}
function cloud(x,y,c){c=c||'#fff';R(x,y+2,15,3,c);R(x+3,y,7,3,c);R(x+9,y+1,4,2,c);}
function line(x0,y0,x1,y1,c){const n=Math.max(1,Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let i=0;i<=n;i++)R(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,1,1,c);}
function skyline(x,y,w,h,horizon,t,seed){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const s=sky(x,y,w,h),r=rng(seed);
  if(s.night&&egg('moon'))R(x+w-14,y+4,6,6,'#fff6d0');
  for(let bx=x-4;bx<x+w;){const bw=6+(r()*10|0),bh=10+(r()*30|0);R(bx,horizon-bh,bw,bh+140,s.night?'#1b2440':'#8b98b5');bx+=bw+1;}
  for(let bx=x-6;bx<x+w;){
    const bw=8+(r()*12|0),bh=18+(r()*60|0),top=horizon-bh,col=s.night?'#2a3352':'#4d5b7c';
    R(bx,top,bw,bh+140,col);
    if(r()<.2){R(bx+(bw>>1),top-7,1,7,col);R(bx+(bw>>1)-1,top-3,3,3,col);}
    for(let wy=top+2;wy<y+h;wy+=3)for(let wx=bx+1;wx<bx+bw-1;wx+=2){const v=r();const tw=((wx*7+wy*13+(t*1.5|0))%89)===0;if(v<(s.night?.4:.3)!==tw)R(wx,wy,1,1,s.night?'#ffd76a':'#a9bdd8');}
    bx+=bw+1;}
  g.restore();return s;
}
function winFrame(x,y,w,h,horizon,t,seed){R(x-2,y-2,w+4,h+4,'#3a4150');const s=skyline(x,y,w,h,horizon,t,seed);R(x+(w>>1)-1,y,2,h,'#3a4150');return s;}

const $=id=>document.getElementById(id);
function fmt(n){n=Math.floor(n);if(n<1000)return ''+n;const u=['K','M','B','T','Qa'];let i=-1;while(n>=1000&&i<4){n/=1000;i++;}return n.toFixed(n<10?1:0)+u[i];}
function fmtDur(s){s=Math.max(0,Math.round(s));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m '+(s%60)+'s';if(s<86400){const h=Math.floor(s/3600);return h+'h '+Math.floor(s%3600/60)+'m';}return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';}

      <div class="small" style="margin-top:10px;line-height:1.6">Careers: ${S.runs}${S.ascended?' · Missions: '+S.sruns:''} · Summits: ${summitN()}/4${S.spaceWon?' · CLO of Space 🌌':''} · Eggs: ${Object.keys(S.eggs).length}/${EGGS.length}<br>Billable hours (claimed): ${fmt(S.runT/3600*1.7)} · (actual): ${fmt(S.runT/3600)}</div>`;
  }else if(S.tab==='tree'){
    const brs=[['core','CORE'],...TIDS.map(t=>[t,TRACKS[t].name.toUpperCase()]),...(S.ascended?[['space','SPACE']]:[])];
    const ids=Object.keys(TREE).filter(id=>TREE[id].br===S.treeBr);
    const tm=TIDS.includes(S.treeBr)&&!S.summits[S.treeBr]&&summitN()?`<div class="small" style="margin-bottom:6px">Tier ${summitN()+1}: costs ×${1+TIER_MULT*summitN()*summitN()} (a new field is harder to break into)</div>`:'';
    b.innerHTML=`<div class="chips">${brs.map(([k,l])=>`<button class="chip ${S.treeBr===k?'on':''}" onclick="S.treeBr='${k}';renderTab()">${l}</button>`).join('')}</div>${tm}`+
      ids.map(id=>{const n=TREE[id],l=tl(id),mx=l>=n.max,met=treeReqMet(id),c=treeCost(id);
        const fxs=n.fx?`<br>${l?'Now '+n.fx(l):''}${mx?'':(l?' → ':'Next ')+n.fx(l+1)}`:'';
        const cur=n.cur||'lp',sym=cur==='sd'?'✧':'✦';return `<div class="item"><div class="ic">${n.icon}</div><div class="b"><div class="n">${n.name} · ${l}/${n.max}</div><div class="d">${n.desc}${fxs}${met?'':'<br>Requires: '+n.req.map(r=>TREE[r].name).join(', ')}</div></div><button class="btn lp" ${cur==='sd'?'style="background:#8ecae6"':''} ${mx||!met||S[cur]<c?'disabled':''} onclick="if(buyTree('${id}')){save();renderAll();toast('${n.name.replace(/'/g,'')} ↑')}">${mx?'MAX':sym+' '+fmt(c)}</button></div>`;}).join('');
  }else if(S.tab==='locker'){
    b.innerHTML=`<div class="sec">EVIDENCE LOCKER · ${Object.keys(S.eggs).length}/${EGGS.length}</div><div class="small" style="margin-bottom:8px">Easter eggs show up in your scenes once found. Tap one for a hint.</div><div class="locker">`+
      EGGS.map(e=>`<div class="egg ${S.eggs[e.id]?'':'off'}" onclick="toast('${(S.eggs[e.id]?e.name+' ✓':e.hint).replace(/'/g,'’')}')">${S.eggNew[e.id]?'<span class="nw">NEW</span>':''}<span class="e">${e.icon}</span>${S.eggs[e.id]?e.name:'???'}</div>`).join('')+`</div>`;
  }else{
    b.innerHTML=`<div class="sec">YOUR LAWYER</div><input class="name" value="${esc(S.name)}" onchange="S.name=this.value.slice(0,24)||S.name;save();renderAll()">
      <div class="small" style="margin:10px 0 4px">Skin</div>${SKINS.map((c,i)=>`<span class="sw ${S.look.skin===i?'on':''}" style="background:${c}" onclick="S.look.skin=${i};renderTab()"></span>`).join('')}
      <div class="small" style="margin:10px 0 4px">Hair</div>${HAIRC.map((c,i)=>`<span class="sw ${S.look.hair===i?'on':''}" style="background:${c}" onclick="S.look.hair=${i};renderTab()"></span>`).join('')}
      <div class="small" style="margin-top:10px;line-height:1.6">Your outfit changes with every job: hoodie → first suit → better suits → robes, vests or a flag pin, depending on the track. Hair grays and glasses appear as you retire more.</div>
      <div class="foot"><button class="btn ghost" onclick="pvStart()">PREVIEW ALL SCENES</button><button class="btn ghost" id="devBtn" onclick="cycleDev()">⏩ ${S.dev}×</button>${canAscend()||S.ascended?'':`<button class="btn ghost" onclick="devSummits()">DEV: 4 SUMMITS</button>`}<button class="btn" style="background:var(--accent)" onclick="confirmReset()">RESET</button></div>`;
  }
  renderLive();
}
function buyPerk(id){const p=PERKS.find(x=>x.id===id),c=perkCost(p);if(S.stars<c)return;S.stars-=c;S.perks[id]=lv(id)+1;save();renderTab();}
function esc(t){return String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');}
function modal(h){$('card').innerHTML=h;$('modal').classList.add('show');}
function closeModal(){$('modal').classList.remove('show');renderAll();}
let toastT;function toast(t){if(SIM)return;const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2800);}
function flash(){const f=$('flash');f.style.transition='none';f.style.opacity=.8;requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0;});}
function showFork(){
  modal(`<h3>YOU PASSED THE BAR!</h3><p>Pick your path. Future careers go straight to it (change it any time you retire).</p>`+
    TIDS.map(k=>{const t=TRACKS[k],ok=trackUnlocked(k);return `<button class="pick ${ok?'':'off'}" ${ok?`onclick="chooseTrack('${k}');closeModal();flash();fx.promo=2;save()"`:''}><b>${t.icon} ${t.name}${S.summits[k]?' 👑':''}</b>${t.blurb}<br><span class="small">Summit: ${t.jobs[9].t}${ok?'':' · unlock in the Tree (Government branch)'}</span></button>`;}).join(''));
}
function confirmAscend(){modal(`<h3>ASCEND?</h3><p>${esc(S.name)} has conquered every summit on Earth. Ascend to become a <b>Space Attorney</b>: a rocket, a Moon base, Mars and beyond, all the way to <b>CLO of Space</b>.</p><p>Your Earth tree, summits and eggs stay. Earth fame gives ×1.5 speed in space. A new ✧ Stardust tree opens.</p><div class="foot"><button class="btn ghost" onclick="closeModal()">NOT YET</button><button class="btn" style="background:#8ecae6" onclick="ascend();save();closeModal();flash();fx.promo=2;toast('LIFTOFF! Welcome to space law.')">ASCEND</button></div>`);}
function confirmRetire(){
  if(!canRetire())return;
  if(S.mode==='space'){modal(`<h3>RELAUNCH?</h3><p>${esc(S.name)} made it to <b>${jobOf(S.maxJ).t}</b>. Relaunch for <b>+${fmt(sdFor(S.maxJ))} ✧</b> Stardust and start a new mission from the launch pad.</p><div class="foot"><button class="btn ghost" onclick="closeModal()">NOT YET</button><button class="btn" style="background:#8ecae6" onclick="const g=retire();save();closeModal();flash();toast('+'+fmt(g)+' ✧ · T-minus 10…');">RELAUNCH</button></div>`);return;}
  modal(`<h3>RETIRE?</h3><p>${esc(S.name)} has gone as far as <b>${jobOf(S.maxJ,S.track).t}</b>. Retire now for <b>+${fmt(lpFor(S.maxJ))} ✦</b> Legacy.</p><p>A fresh 1L starts over with your skill tree. Perks and ★ reset.</p>
    <p class="small">Next career's track:</p>${TIDS.filter(trackUnlocked).map(k=>`<button class="pick ${S.pref===k?'':'off'}" style="opacity:${S.pref===k?1:.6}" onclick="S.pref='${k}';confirmRetire()"><b>${TRACKS[k].icon} ${TRACKS[k].name}${S.pref===k?' ✓':''}</b></button>`).join('')}
    <div class="foot"><button class="btn ghost" onclick="closeModal()">NOT YET</button><button class="btn lp" onclick="const g=retire();save();closeModal();flash();toast('+'+fmt(g)+' ✦ · A new 1L arrives');">RETIRE</button></div>`);
}
function confirmReset(){modal(`<h3>RESET SAVE?</h3><p>Wipes everything: tree, eggs, summits.</p><div class="foot"><button class="btn ghost" onclick="closeModal()">CANCEL</button><button class="btn" style="background:var(--accent)" onclick="try{localStorage.removeItem(SAVE)}catch(e){};S=fresh();closeModal()">RESET</button></div>`);}
const DEVS=[1,60,3600];function cycleDev(){S.dev=DEVS[(DEVS.indexOf(S.dev)+1)%DEVS.length];renderTab();}
function devSummits(){modal(`<h3>DEV SHORTCUT</h3><p>Mark all four summits as conquered so you can try the space layer? Test-only; it changes this save.</p><div class="foot"><button class="btn ghost" onclick="closeModal()">CANCEL</button><button class="btn" onclick="TIDS.forEach(t=>S.summits[t]=true);save();closeModal()">DO IT</button></div>`);}
let jokeAt=-1e9;function tickJoke(now){if(now-jokeAt<14000)return;jokeAt=now;const el=$('overheard');if(el)el.textContent='💬 '+pick(jokePool());}
function pvStart(){preview=Math.max(0,ALLJOBS.findIndex(a=>a.J===S.J&&a.mode===S.mode&&(S.mode==='space'||S.J<SCHOOL_N||a.track===S.track)));$('pv').classList.add('show');renderJob();window.scrollTo(0,0);}
function pvStep(d){preview=(preview+d+ALLJOBS.length)%ALLJOBS.length;renderJob();}
function pvStop(){preview=null;$('pv').classList.remove('show');renderJob();}

/* ============================ SAVE / BOOT ============================ */
function save(){if(SIM)return;S.lastSeen=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(SAVE));}catch(e){}const f=fresh();S=Object.assign(f,d||{});S.stats=Object.assign(f.stats,(d||{}).stats);S.look=Object.assign({skin:1,hair:0},(d||{}).look);}
function nightCheck(){const h=new Date().getHours();if((h>=21||h<5)&&Date.now()-S.stats.lastNight>3*3600e3){S.stats.nights++;S.stats.lastNight=Date.now();}}
function catchUp(){
  const away=Math.min((Date.now()-S.lastSeen)/1000,offlineCap());
  if(away<5)return;
  const ev=advance(away);nightCheck();rollEggs(ev);save();
  if(away>90&&(ev.loops||ev.eggs.length))modal(`<h3>WELCOME BACK</h3><p>Away ${fmtDur(away)}${away>=offlineCap()-1?' (offline cap reached)':''}.</p><p>+${ev.loops} loops · +${fmt(ev.stars)} ★</p>${ev.promos.length?'<p>Career: <b>'+ev.promos.slice(-6).join(' → ')+'</b></p>':''}${ev.eggs.length?'<p>Found: <b>'+ev.eggs.join(', ')+'</b> 🥚</p>':''}${canRetire()?'<p class="small">Retiring now banks +'+fmt(lpFor(S.maxJ))+' ✦.</p>':''}<div class="foot"><button class="btn" onclick="closeModal()">OK</button></div>`);
}
let last,acc=0,uiAcc=0,animT=0,saveAcc=0,jobKey='';
function frameLoop(now){
  const dt=Math.min(.5,(now-last)/1000);last=now;
  advance(dt);
  const k=S.J+'|'+S.track;if(k!==jobKey){if(jobKey){flash();toast('NEW JOB: '+jobOf().t.toUpperCase());}jobKey=k;renderAll();}
  if(S.fork&&!$('modal').classList.contains('show'))showFork();
  fx.pop=Math.max(0,fx.pop-dt*1.2);fx.promo=Math.max(0,fx.promo-dt*.5);for(const p of fx.taps)p.a-=dt*1.5;
  animT+=dt;acc+=dt;if(acc>=1/12){acc=0;drawScene(animT);}
  uiAcc+=dt;if(uiAcc>.3){uiAcc=0;renderLive();tickJoke(now);}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();renderTabs();}
  requestAnimationFrame(frameLoop);
}
if(!SIM){
  const cv=$('scene');g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();fx.taps.push({x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H,a:1});S.stats.taps++;rollEggs({eggs:[]});});
  load();catchUp();nightCheck();rollEggs({eggs:[]});jobKey=S.J+'|'+S.track;renderAll();
  last=performance.now();requestAnimationFrame(frameLoop);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{catchUp();renderAll();}});
  window.addEventListener('beforeunload',save);window.addEventListener('pagehide',save);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{}); // installed app: keep the save
}
</script>
</body>
